<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎉</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

/* 🌌 stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: floatStar linear infinite;
}

/* movement */
@keyframes floatStar {
  from {
    transform: translateY(100vh);
  }
  to {
    transform: translateY(-10vh);
  }
}


/* animated bg */
/* 🔥 animated gradient background */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  color: white;

  background: linear-gradient(
    -45deg,
    #ff4b2b,
    #ff416c,
    #3a86ff,
    #8338ec,
    #06d6a0
  );

  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

/* gradient animation */
@keyframes gradientBG {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* 🔥 dotted overlay */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  pointer-events: none;

  background-image: radial-gradient(circle, white 1px, transparent 1px);
  background-size: 35px 35px;

  opacity: 0.2;
  animation: dotsMove 12s linear infinite;
}

/* dots animation */
@keyframes dotsMove {
  100% { transform: translate(-35px, -35px); }
}

@keyframes move {
  100% { transform: translate(-60px,-60px); }
}

/* shake */
.shake {
  animation: shake 0.5s;
}
@keyframes shake {
  25% { transform: translate(-3px,3px); }
  50% { transform: translate(3px,-3px); }
  75% { transform: translate(-3px,3px); }
}

.container {
  text-align: center;
  color: white;
  z-index: 2;
  padding: 20px;
}

/* button */
button {
  padding: 14px 28px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(45deg, #00c9ff, #92fe9d);
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px #00c9ff;
}

button:active {
  transform: scale(0.95);
}

/* no btn */
#noBtn {
  position: absolute;
}

/* typing */
.typing {
  border-right: 3px solid white;
  white-space: normal;
  display: inline-block;
  animation: fadeIn 2s ease;
}

/* fade */
@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

h1 {
  display: none;
  animation: fadeIn 1.5s ease forwards;
}

.message {
  display: none;
  font-size: 22px;
  margin-top: 20px;
}

/* particles */
.particle {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
</style>
</head>

<body>

<div class="container" id="screen">

  <!-- Step 1 -->
  <div id="start">
    <h2>🎁 Are you ready for a surprise?</h2>
    <button onclick="start()">Yes 😄</button>
    <button id="noBtn" onmouseover="moveNo()">No 😅</button>
  </div>

  <!-- Step 2 -->
  <div id="main" style="display:none;">
    <h1 id="title">🎉 Happy Birthday Nasrin Khatoon 🎉</h1>

    <div class="message" id="msg">
      <div class="typing">
        💙 You are an amazing Mukhiya ji 😄
      </div>
      <br><br>
      🎂 May your life be full of happiness,<br>
      success & unlimited fun!<br><br>
      😎 Be Strong, Be Happy!
    </div>
  </div>

</div>

<script>

function start() {
  document.getElementById("start").style.display = "none";
  document.getElementById("main").style.display = "block";

  let screen = document.getElementById("screen");
  screen.classList.add("shake");

  setTimeout(()=> screen.classList.remove("shake"), 500);

  setTimeout(() => {
    document.getElementById("title").style.display = "block";
  }, 300);

  setTimeout(() => {
    document.getElementById("msg").style.display = "block";
  }, 1000);

  fireworks();
}

/* no button move (fixed for mobile) */
function moveNo() {
  let btn = document.getElementById("noBtn");

  let x = Math.random() * (window.innerWidth - btn.offsetWidth);
  let y = Math.random() * (window.innerHeight - btn.offsetHeight);

  btn.style.left = x + "px";
  btn.style.top = y + "px";
}

/* fireworks */
function fireworks() {
  for (let i=0;i<100;i++) {
    let p = document.createElement("div");
    p.classList.add("particle");

    p.style.left = window.innerWidth/2 + "px";
    p.style.top = window.innerHeight/2 + "px";
    p.style.background = randomColor();

    document.body.appendChild(p);

    let angle = Math.random()*2*Math.PI;
    let radius = Math.random()*300;

    p.animate([
      { transform: "translate(0,0)" },
      { transform: `translate(${Math.cos(angle)*radius}px, ${Math.sin(angle)*radius}px)` }
    ], {
      duration: 1200,
      easing: "ease-out"
    });

    setTimeout(()=>p.remove(),1200);
  }
}

function randomColor() {
  return ["#ff0","#0ff","#f0f","#0f0","#ff5733"][Math.floor(Math.random()*5)];
}

/* 🌌 create stars */
function createStars() {
  for (let i = 0; i < 120; i++) {
    let s = document.createElement("div");
    s.className = "star";

    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";

    s.style.animationDuration = (5 + Math.random() * 5) + "s";
    s.style.opacity = Math.random();

    document.body.appendChild(s);
  }
}

/* call on load */
createStars();

</script>

</body>
</html>
